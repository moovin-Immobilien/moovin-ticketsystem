openapi: 3.1.0
info:
  title: moovin Ticket-API
  version: 2.0.0
  description: |
    Schmale, zweckgebundene Schnittstelle zwischen app.moovin.de und dem moovin Ticketsystem.
    STATUS: technischer Entwurf des Prototyps (Attrappe unter /api/mock-moovin/v1). Maßgeblich sind die fachlichen
    Anforderungen im Übergabedokument; Endpunkte, Feldnamen und Sicherheitstechnik entwirft die moovin-IT (Guido).

    ## Umfang: fünf Aufrufe
    - Lesen: `GET /applicants`, `GET /listings/{id}`.
    - Schreiben: `POST /appointments/{id}/reply`, `POST /applicants/{id}/documents`, `POST /applications/{id}/notes`.
    - Optional: `POST /applicants/{id}/correspondence` legt je Aufruf eine Nachricht (Bewerber-Mail oder Antwort) im Bewerber ab.
      Ohne diesen Aufruf (404) läuft alles andere unverändert; im Ticketsystem per `MOOVIN_COPY_CORRESPONDENCE=0` abschaltbar.

    ## Sicherheit
    - Nur Server-zu-Server. Jede Anfrage ist HMAC-SHA256-signiert:
      `signature = hex(HMAC_SHA256(secret, timestamp + "\n" + METHOD + "\n" + path_with_query + "\n" + sha256_hex(body)))`
      Header: `X-Moovin-Key-Id`, `X-Moovin-Timestamp` (Unix-Sekunden), `X-Moovin-Signature`.
      moovin lehnt ab, wenn |jetzt − timestamp| > 300 s oder die Signatur nicht passt (constant-time compare).
    - Jede Anfrage trägt `X-Subject-Email` = Mailadresse des Absenders. moovin prüft, dass jede angefragte bzw.
      veränderte Ressource (Bewerbung, Termin, Inserat) zu dieser Mailadresse gehört, sonst 404.
      Damit kann selbst ein fehlerhaftes Ticketsystem keine fremden Daten lesen oder ändern.
    - Schreibende Aufrufe tragen `Idempotency-Key`; Wiederholungen mit gleichem Key liefern das erste Ergebnis.
    - Mehrere Schlüssel gleichzeitig gültig (Rotation über `X-Moovin-Key-Id`).
    - moovin protokolliert jeden Aufruf (Key-Id, Pfad, Subject-Email, Ergebnis).
    - Statuscodes: 401 Signatur/Zeitstempel/Key-Id ungültig · 400 Pflicht-Header oder Eingabe ungültig ·
      404 unbekannt ODER gehört nicht zur `X-Subject-Email` (bewusst nicht unterscheidbar) · 409 Termin nicht mehr offen.
    - Konformitätstest: `scripts/api-check.ts` prüft eine Implementierung gegen diesen Vertrag.

    ## Datensparsamkeit
    - Nur die Felder unten, keine weiteren. Keine Vornamen, Telefonnummern, Wohnadressen, Geburtsdaten,
      Einkommens- oder Bonitätsdaten, Scores, Rankings, Ablehnungsgründe, internen Notizen, Dokumentinhalte.
    - Nur aktuelle Bewerbungen: angelegt in den letzten 180 Tagen; abgeschlossene (absage, zurueckgezogen) nur bis 30 Tage danach.
    - Statustexte formuliert das Ticketsystem selbst aus dem `status`-Wert.

    ## Mehrere Bewerbungen: welcher Termin ist gemeint?
    Es gibt keine Termin-Kennung in Mails (moovin-Termin-IDs sind intern). Das Ticketsystem ordnet zu:
    nur ein offener Termin → dieser; sonst nur, wenn Datum/Uhrzeit, Adresse oder Inserats-Kennung genau eines
    Termins in der Mail stehen. Andernfalls keine Terminaktion, sondern Rückfrage an den Bewerber.
    Verschiebewünsche laufen nicht über die API: das Ticketsystem mailt sie direkt dem zuständigen AM.
servers:
  - url: https://app.moovin.de/api/ticket/v1
    description: Produktion (Vorschlag)
  - url: /api/mock-moovin/v1
    description: Attrappe im Prototyp
security:
  - hmac: []
components:
  securitySchemes:
    hmac:
      type: apiKey
      in: header
      name: X-Moovin-Signature
  parameters:
    SubjectEmail:
      name: X-Subject-Email
      in: header
      required: true
      schema: { type: string, format: email }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 200 }
  schemas:
    Applicant:
      type: object
      additionalProperties: false
      required: [id, last_name]
      properties:
        id: { type: string }
        salutation: { type: [string, "null"], enum: [Herr, Frau, null], description: Nur für die Anrede }
        last_name: { type: string, description: Nur für die Anrede }
        language: { type: [string, "null"], example: de }
    Appointment:
      type: object
      additionalProperties: false
      required: [id, starts_at, status]
      properties:
        id: { type: string, description: "Interne Kennung; wird nie an Bewerber herausgegeben" }
        starts_at: { type: string, format: date-time, description: ISO 8601 mit Zeitzone }
        ends_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [eingeladen, bestaetigt, abgesagt, stattgefunden, no_show] }
        meeting_point: { type: [string, "null"] }
    Application:
      type: object
      additionalProperties: false
      required: [id, listing_id, object_title, status, missing_documents]
      properties:
        id: { type: string }
        listing_id: { type: string, example: MV-ABC123 }
        object_title: { type: string, description: Wie im Inserat, example: "2-Zimmer, Lindenallee 12, Hamburg" }
        status: { type: string, enum: [eingegangen, unvollstaendig, in_pruefung, eingeladen, besichtigt, beim_eigentuemer, zusage, absage, zurueckgezogen] }
        missing_documents: { type: array, items: { type: string }, description: Nur Dokumentarten, z. B. "SCHUFA-Auskunft" }
        account_manager_email: { type: [string, "null"], format: email, description: Für die Zuweisung des Tickets }
        appointment:
          oneOf: [{ $ref: "#/components/schemas/Appointment" }, { type: "null" }]
          description: Nächster offener, sonst letzter Termin dieser Bewerbung
    ApplicantContext:
      type: object
      additionalProperties: false
      required: [applicant, applications]
      properties:
        applicant: { $ref: "#/components/schemas/Applicant" }
        applications: { type: array, items: { $ref: "#/components/schemas/Application" } }
    Listing:
      type: object
      description: Nur öffentliche Inseratsdaten
      required: [id, title, address]
      properties:
        id: { type: string }
        title: { type: string }
        address: { type: string }
        rooms: { type: [number, "null"] }
        size_sqm: { type: [number, "null"] }
        rent_cold_eur: { type: [number, "null"] }
        rent_warm_eur: { type: [number, "null"] }
        available_from: { type: [string, "null"], format: date }
        pets: { type: [string, "null"] }
        parking: { type: [string, "null"] }
        wbs_required: { type: [boolean, "null"] }
        viewing_info: { type: [string, "null"] }
        listing_url: { type: [string, "null"] }
    Error:
      type: object
      properties:
        error: { type: string }
paths:
  /applicants:
    get:
      summary: "Bewerber und aktuelle Bewerbungen zur Absender-Mailadresse"
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - name: email
          in: query
          required: true
          description: Muss gleich X-Subject-Email sein (Groß-/Kleinschreibung egal), sonst 400
          schema: { type: string, format: email }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicantContext" } } } }
        "404": { description: Adresse unbekannt }
  /listings/{listingId}:
    get:
      summary: "Öffentliche Inseratsdaten (nur Inserate, auf die sich der Absender beworben hat)"
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - { name: listingId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } } }
        "404": { description: Unbekannt oder nicht zum Absender gehörig }
  /appointments/{appointmentId}/reply:
    post:
      summary: "Antwort des Bewerbers auf eine Einladung: zusagen oder absagen"
      description: |
        zusage → Status bestaetigt (bereits bestätigt → 200). absage → Status abgesagt, Platz wird frei.
        Termin abgesagt, vergangen oder stattgefunden → 409. (Verschiebewünsche mailt das Ticketsystem direkt an den AM.)
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: appointmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ticket_id, answer]
              properties:
                source_ticket_id: { type: string, example: T-123 }
                answer: { type: string, enum: [zusage, absage] }
                comment: { type: string, maxLength: 500 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
        "400": { description: Eingabe ungültig }
        "404": { description: Unbekannt oder nicht zum Absender gehörig }
        "409": { description: Termin nicht mehr offen }
  /applicants/{applicantId}/documents:
    post:
      summary: "Mail-Anhänge im Bewerberprofil ablegen (gilt für alle Bewerbungen; Status „neu, ungeprüft“; geprüft wird wie bisher in moovin)"
      description: applicantId = applicant.id aus GET /applicants; muss zur X-Subject-Email gehören, sonst 404.
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: applicantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ticket_id, files]
              properties:
                source_ticket_id: { type: string }
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [filename, content_type, content_base64]
                    properties:
                      filename: { type: string }
                      content_type: { type: string }
                      content_base64: { type: string, description: höchstens 15 MB je Datei }
      responses:
        "201": { description: Abgelegt }
        "400": { description: Eingabe ungültig }
        "404": { description: Unbekannt oder nicht zum Absender gehörig }
  /applicants/{applicantId}/correspondence:
    post:
      summary: "Optional · Kopie einer Nachricht (Bewerber-Mail oder Antwort) im Bewerber ablegen (Verlauf für AMs in moovin)"
      description: |
        Ein Aufruf je Nachricht. Wird nach jedem Versand für alle noch nicht kopierten Nachrichten des Tickets aufgerufen.
        Anhänge nur als Dateinamen (Dateien gehen über /documents). applicantId muss zur X-Subject-Email gehören, sonst 404.
        sender_verified = false heißt: Absenderadresse technisch nicht bestätigt (bitte in moovin kenntlich machen).
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: applicantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ticket_id, direction, text]
              properties:
                source_ticket_id: { type: string, example: T-123 }
                ticket_url: { type: string }
                application_id: { type: [string, "null"], description: Bewerbung, um die es ging (falls eindeutig) }
                direction: { type: string, enum: [in, out] }
                sent_at: { type: string, format: date-time }
                from: { type: string }
                to: { type: string }
                subject: { type: string }
                text: { type: string, maxLength: 20000 }
                attachments: { type: array, items: { type: string }, description: Nur Dateinamen }
                sender_verified: { type: boolean, description: Nur bei direction=in }
                sent_by: { type: string, description: "Nur bei direction=out: KI oder E-Mail des AM" }
      responses:
        "201": { description: Abgelegt }
        "400": { description: Eingabe ungültig }
        "404": { description: Unbekannt, nicht zum Absender gehörig oder Endpunkt nicht gebaut }
  /applications/{applicationId}/notes:
    post:
      summary: "Notiz an der Bewerbung für den AM (z. B. Rückzug, Interesse, Hinweise aus der Mail)"
      parameters:
        - $ref: "#/components/parameters/SubjectEmail"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ticket_id, text]
              properties:
                source_ticket_id: { type: string }
                text: { type: string, maxLength: 4000 }
                ticket_url: { type: string, description: Link zurück ins Ticket }
      responses:
        "201": { description: Angelegt }
        "400": { description: Eingabe ungültig }
        "404": { description: Unbekannt oder nicht zum Absender gehörig }
